name: client-go-release

on:
  push:
    tags: ['v*']
  # a broken release workflow used to explode only at tag time; now
  # the gate (test/test-windows/build) validates on PRs too — the
  # release job below stays tag-gated
  pull_request:
    paths:
      - .github/workflows/client-go-release.yml
      - client-go/**
      - server.js
      - tests/**

env:
  # pinned mpv daily build (shinchiro date tags): same tag => same bytes,
  # verified against the GitHub asset digest at download time. Bump the
  # tag to refresh the bundled player — never build from "latest".
  MPV_TAG: '20261021'

permissions:
  contents: read

jobs:
  # full gate before anything ships: a tag must pass the same checks
  # as main CI (previously vet+test ran once per matrix entry — 5x the
  # same linux run, no race/gofmt/audit3)
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client-go/go.mod
      # mpv before the go tests: TestCleanQuitExitsZero (exit-code
      # contract, clean=0) skips without it (F2 review P2-2); ffmpeg
      # is only needed by the node e2e suites below
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq mpv ffmpeg
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: ../tests/ci_retry.sh go test -race ./...
      - run: ../tests/ci_retry.sh go test -tags audit3 ./internal/...
      # the wire's only e2e tests: a tag may ship server.js changes, so
      # the node battery gates releases too (mpv+ffmpeg ≈ 1-2 min)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: go build -o watchparty .
        working-directory: client-go
      - run: |
          # each suite gets the documented single re-run (decisions #56):
          # 2-core CI runners trip timing pins; deterministic failures
          # still fail twice
          for s in smoke persist audit_server audit2_server audit3_server \
                   f2_server f1_server integration pause_sync \
                   stall_family master_restart soak; do
            # this block runs from the repo ROOT (see working-directory
            # below) — NOT the ../tests path the client-go steps use
            tests/ci_retry.sh node tests/$s.mjs || exit 1
          done
        # the job default (client-go) does not contain tests/: run the
        # suites from the workspace root, like the CI node job
        working-directory: ${{ github.workspace }}

  # m2-504: the gate never executed windows code paths — a Windows-only
  # break could ship from a tag even though main CI runs this job.
  # Mirror of the CI test-windows job (no -race, no mpv e2e).
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client-go/go.mod
      - run: go vet ./...
      - shell: bash
        run: ../tests/ci_retry.sh go test ./...

  build:
    needs: [test, test-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client-go
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client-go/go.mod
      - run: >-
          go build -trimpath -ldflags="-s -w"
          -o watchparty${{ matrix.ext }} .
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - uses: actions/upload-artifact@v4
        with:
          name: watchparty-${{ matrix.goos }}-${{ matrix.goarch }}
          path: client-go/watchparty${{ matrix.ext }}

  release:
    needs: build
    # PR runs stop after the gate; tag pushes ship (belt AND suspenders:
    # the event filter documents intent, the ref filter is the boundary)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30 # m2-505: a hung e2e must not lock the release for 6h
    permissions:
      contents: write # only the release job may write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: assemble zips + windows mpv bundle
        run: |
          mkdir dist
          for d in artifacts/watchparty-*; do
            plat=$(basename "$d")
            # windows ships ONLY as the mpv bundle below: a bare windows
            # zip with the same "nothing else needed" README is how a
            # friend ends up at "mpv not found"
            [ "$plat" = "watchparty-windows-amd64" ] && continue
            # m2-508: README-friend.txt is Windows instructions; the
            # linux/macOS zips carry a one-line usage note instead
            note='Run ./watchparty <host:port> (host: --master --name <nick>)'
            printf '%s\n' "$note" > "$d/README.txt"
            zip -j "dist/${plat}.zip" "$d"/watchparty* "$d/README.txt"
          done
          # friend bundle: portable mpv next to the exe (plan Q2), pinned to
          # MPV_TAG and digest-verified — a repackaged download must fail
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full jq
          tagged=$(curl -sL \
            "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/tags/$MPV_TAG")
          pick='mpv-x86_64-[0-9]' # plain x86_64; -v3- needs AVX-512, excluded
          url=$(echo "$tagged" | jq -r --arg re "$pick" \
            '.assets[] | select(.name | test($re))
             | .browser_download_url' | head -1)
          want=$(echo "$tagged" | jq -r --arg re "$pick" \
            '.assets[] | select(.name | test($re))
             | .digest' | head -1)
          # m2-507: this used to be `test -n "$url" && test ...` — an
          # AND-list is exempt from set -e, so a missing asset failed
          # silently into a confusing curl/sha256 error below
          if [ -z "$url" ] || [ -z "$want" ] || [ "$want" = "null" ]; then
            echo "no mpv asset matched tag=$MPV_TAG pick=$pick" >&2
            exit 1
          fi
          curl -sL -o /tmp/mpv.7z "$url"
          echo "${want#sha256:}  /tmp/mpv.7z" | sha256sum -c -
          7z x -y /tmp/mpv.7z -o/tmp/mpv-portable >/dev/null
          mkdir /tmp/bundle
          cp artifacts/watchparty-windows-amd64/watchparty.exe /tmp/bundle/
          cp client-go/README-friend.txt /tmp/bundle/
          cp -r /tmp/mpv-portable/* /tmp/bundle/
          # shinchiro's 7z may extract into top-level dir(s); flatten by
          # COPY (mv '*' drops dotfiles and rmdir then fails the step) and
          # assert the canonical layout: mpv.exe beside watchparty.exe
          if [ ! -f /tmp/bundle/mpv.exe ]; then
            for sub in /tmp/bundle/*/; do
              cp -r "${sub%/}/." /tmp/bundle/
              rm -rf "${sub%/}"
            done
          fi
          test -f /tmp/bundle/mpv.exe
          cd /tmp/bundle
          zip -r "$GITHUB_WORKSPACE/dist/watchparty-windows-bundle.zip" .
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum *.zip > SHA256SUMS
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # re-runnable without a vanish window: refresh assets in place
          # instead of delete+create (shared links stay valid)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/*.zip dist/SHA256SUMS --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "watchparty $GITHUB_REF_NAME (mpv $MPV_TAG)" \
              --notes-file client-go/CHANGELOG.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "watchparty $GITHUB_REF_NAME (mpv $MPV_TAG)" \
              --notes-file client-go/CHANGELOG.md dist/*.zip dist/SHA256SUMS
          fi
