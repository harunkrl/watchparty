name: client-go-release

on:
  push:
    tags: ['v*']
  # a broken release workflow used to explode only at tag time; now
  # the gate (test/test-windows/build) validates on PRs too — the
  # release job below stays tag-gated
  pull_request:
    paths:
      - .github/workflows/client-go-release.yml
      - client-go/**
      - server.js
      - tests/**

env:
  # pinned mpv daily build (shinchiro date tags): same tag => same bytes,
  # verified against the GitHub asset digest at download time. Bump the
  # tag to refresh the bundled player — never build from "latest".
  # The Windows bundle's mpv build. ROTATION IS MANUAL: to ship a newer
  # mpv, download the new mpv-winbuild asset, sha256 it, and update BOTH
  # this tag AND the vetted digest in .github/workflows/mpv-bundle.sha256
  # (the release check compares the download against THAT file, not against
  # the upstream api's own claim). Who: the maintainer. When: with any
  # release that wants a newer mpv (the tag below is from 2026-10-21).
  MPV_TAG: '20261021'

permissions:
  contents: read

jobs:
  # full gate before anything ships: a tag must pass the same checks
  # as main CI (previously vet+test ran once per matrix entry — 5x the
  # same linux run, no race/gofmt/audit3)
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client-go/go.mod
      # mpv before the go tests: TestCleanQuitExitsZero (exit-code
      # contract, clean=0) skips without it (F2 review P2-2); ffmpeg
      # is only needed by the node e2e suites below
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq mpv ffmpeg
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: ../tests/ci_retry.sh go test -race ./...
      - run: ../tests/ci_retry.sh go test -tags audit3 ./internal/...
      # the wire's only e2e tests: a tag may ship server.js changes, so
      # the node battery gates releases too (mpv+ffmpeg ≈ 1-2 min)
      - uses: actions/setup-node@v4
        with:
          # A7-m2-04: Node 20 went EOL on 2026-04-30 — CI must run the
          # same runtime the dev box runs (v22).
          node-version: 22
      - run: go build -o watchparty .
        working-directory: client-go
      - run: |
          # each suite gets the documented single re-run (decisions #56):
          # 2-core CI runners trip timing pins; deterministic failures
          # still fail twice
          for s in smoke persist audit_server audit2_server audit3_server \
                   f2_server f1_server integration pause_sync \
                   stall_family master_restart soak f6_server f10_server \
                   status_render room_pause; do
            # this block runs from the repo ROOT (see working-directory
            # below) — NOT the ../tests path the client-go steps use
            tests/ci_retry.sh node tests/$s.mjs || exit 1
          done
        # the job default (client-go) does not contain tests/: run the
        # suites from the workspace root, like the CI node job
        working-directory: ${{ github.workspace }}

      # F6/C3: the retry must not hide the flake — the failed run's logs
      # become an artifact, so the flake hunt finally has eyes.
      # A7 P2-2: this step used to sit BEFORE go vet / go test / the node
      # battery, so in the release gate it could never upload anything.
      # It is LAST now, and always() makes it fire even when the job was
      # cancelled after a failure.
      # B3-3: failure() is FALSE on a CANCELLED (timeout) run, so the
      # flake forensics logs vanished exactly when they were needed.
      # always() alone keeps them; a clean first try rm's its own log
      # (tests/ci_retry.sh), so a green run uploads nothing.
      - name: upload the test logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wp-retry-*.log
          if-no-files-found: ignore

  # m2-504: the gate never executed windows code paths — a Windows-only
  # break could ship from a tag even though main CI runs this job.
  # Mirror of the CI test-windows job (no -race, no mpv e2e).
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client-go/go.mod
      - run: go vet ./...
      - shell: bash
        run: ../tests/ci_retry.sh go test ./...

      # F6/C3: the retry must not hide the flake — the failed run's logs
      # become an artifact, so the flake hunt finally has eyes
      # B3-3: failure() is FALSE on a CANCELLED (timeout) run, so the
      # flake forensics logs vanished exactly when they were needed.
      # always() alone keeps them; a clean first try rm's its own log
      # (tests/ci_retry.sh), so a green run uploads nothing.
      - name: upload the test logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wp-retry-*.log
          if-no-files-found: ignore

  build:
    needs: [test, test-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client-go
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client-go/go.mod
      - run: >-
          go build -trimpath -ldflags="-s -w"
          -o watchparty${{ matrix.ext }} .
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - uses: actions/upload-artifact@v4
        with:
          name: watchparty-${{ matrix.goos }}-${{ matrix.goarch }}
          path: client-go/watchparty${{ matrix.ext }}

  release:
    needs: build
    # PR runs stop after the gate; tag pushes ship (belt AND suspenders:
    # the event filter documents intent, the ref filter is the boundary)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30 # m2-505: a hung e2e must not lock the release for 6h
    permissions:
      contents: write # only the release job may write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: assemble zips + windows mpv bundle
        run: |
          mkdir dist
          for d in artifacts/watchparty-*; do
            plat=$(basename "$d")
            # windows ships ONLY as the mpv bundle below: a bare windows
            # zip with the same "nothing else needed" README is how a
            # friend ends up at "mpv not found"
            [ "$plat" = "watchparty-windows-amd64" ] && continue
            # m2-508: README-friend.txt is Windows instructions; the
            # linux/macOS zips carry a one-line usage note instead
            note='Run ./watchparty <host:port> (host: --master --name <nick>)'
            printf '%s\n' "$note" > "$d/README.txt"
            zip -j "dist/${plat}.zip" "$d"/watchparty* "$d/README.txt"
          done
          # friend bundle: portable mpv next to the exe (plan Q2), pinned to
          # MPV_TAG and checked against the digest vetted IN THE REPO — a
          # repackaged download must fail
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full jq
          tagged=$(curl -sL \
            "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/tags/$MPV_TAG")
          pick='mpv-x86_64-[0-9]' # plain x86_64; -v3- needs AVX-512, excluded
          url=$(echo "$tagged" | jq -r --arg re "$pick" \
            '.assets[] | select(.name | test($re))
             | .browser_download_url' | head -1)
          # A7-m2-03: the vetted digest lives IN THE REPO. The old check
          # read the expected sha256 from the SAME api response that hands
          # out the url, so a replaced upstream asset passed its own check;
          # now the repo value is the only accepted truth.
          digest_file=.github/workflows/mpv-bundle.sha256
          want=$(awk '!/^#/ && NF {print $1; exit}' "$digest_file")
          wantname=$(awk '!/^#/ && NF {print $2; exit}' "$digest_file")
          # m2-507: this used to be `test -n "$url" && test ...` — an
          # AND-list is exempt from set -e, so a missing asset failed
          # silently into a confusing curl/sha256 error below
          if [ -z "$url" ]; then
            echo "no mpv asset matched tag=$MPV_TAG pick=$pick" >&2
            exit 1
          fi
          if [ -z "$want" ] || [ -z "$wantname" ]; then
            echo "no vetted mpv digest in $digest_file" >&2
            exit 1
          fi
          if [ "$(basename "$url")" != "$wantname" ]; then
            echo "the mpv asset changed: $(basename "$url") != $wantname" >&2
            echo "re-vet it and update $digest_file" >&2
            exit 1
          fi
          curl -sL -o /tmp/mpv.7z "$url"
          echo "$want  /tmp/mpv.7z" | sha256sum -c -
          7z x -y /tmp/mpv.7z -o/tmp/mpv-portable >/dev/null
          mkdir /tmp/bundle
          cp artifacts/watchparty-windows-amd64/watchparty.exe /tmp/bundle/
          cp client-go/README-friend.txt /tmp/bundle/
          cp -r /tmp/mpv-portable/* /tmp/bundle/
          # shinchiro's 7z may extract into top-level dir(s); flatten by
          # COPY (mv '*' drops dotfiles and rmdir then fails the step) and
          # assert the canonical layout: mpv.exe beside watchparty.exe
          if [ ! -f /tmp/bundle/mpv.exe ]; then
            for sub in /tmp/bundle/*/; do
              cp -r "${sub%/}/." /tmp/bundle/
              rm -rf "${sub%/}"
            done
          fi
          test -f /tmp/bundle/mpv.exe
          # F8 item 4: the bundle must NOT ship mpv's self-updater. A
          # double-click on updater.bat replaces the pinned mpv.exe with an
          # upstream build and voids the digest story (mpv-bundle.sha256)
          # with no undo. EXACTLY two files go (the human's scope: no other
          # trim) — the other .bat files are mpv's own portable helpers.
          rm -f /tmp/bundle/updater.bat /tmp/bundle/installer/updater.ps1
          # the file-set assertion: the bundle is the vetted tree MINUS the
          # updater pair. A changed upstream layout must fail HERE, not in
          # a friend's folder.
          for f in mpv.exe watchparty.exe README-friend.txt; do
            if [ ! -f "/tmp/bundle/$f" ]; then
              echo "the bundle is missing $f" >&2
              exit 1
            fi
          done
          if find /tmp/bundle -iname '*updat*' | grep -q .; then
            echo "a self-updater file is still in the bundle:" >&2
            find /tmp/bundle -iname '*updat*' >&2
            exit 1
          fi
          count=$(find /tmp/bundle -type f | wc -l)
          echo "bundle files: $count"
          if [ "$count" -lt 10 ] || [ "$count" -gt 20 ]; then
            echo "the bundle file count moved ($count) — re-vet the tree" >&2
            exit 1
          fi
          cd /tmp/bundle
          zip -r "$GITHUB_WORKSPACE/dist/watchparty-windows-bundle.zip" .
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum *.zip > SHA256SUMS
      - name: changelog gate — the tag needs its own changelog section
        run: |
          # F6 D4: a tag without a "## <tag>" section in the changelog
          # would ship a release nobody can read about. Fail the release
          # instead: the changelog entry is part of the release contract.
          # A7 P3-5: the tag heading may carry a title ("## v1.8.1 — ...")
          # or stand alone at EOL ("## v1.8.1") — both count.
          tag_re=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/[.[\*^$]/\\&/g')
          if ! grep -qE "^## ${tag_re}( |$)" client-go/CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${GITHUB_REF_NAME}'" >&2
            exit 1
          fi
      - name: release notes — this tag's changelog section only
        run: |
          # the whole changelog as release notes buries this release; the
          # notes are the tag's own section (+ the bundle facts)
          # the same rule as the gate: the heading may carry a title or
          # stand alone at EOL (A7 P3-5)
          awk -v head="## ${GITHUB_REF_NAME}" '
            function ishead(l) {
              l = length(head)
              return index($0, head) == 1 && \
                (length($0) == l || substr($0, l + 1, 1) == " ")
            }
            ishead() { on = 1; print; next }
            on && /^## / { exit }
            on { print }
          ' client-go/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::the ${GITHUB_REF_NAME} section is empty" >&2
            exit 1
          fi
          size=$(du -h dist/watchparty-windows-bundle.zip | cut -f1)
          {
            echo "The Windows bundle carries a portable mpv"
            echo "(pinned to $MPV_TAG) — expect $size to download."
            echo "The other zips are the client alone."
            echo ""
            cat "$RUNNER_TEMP/notes.md"
          } > "$RUNNER_TEMP/notes-final.md"
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # re-runnable without a vanish window: refresh assets in place
          # instead of delete+create (shared links stay valid)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/*.zip dist/SHA256SUMS --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "watchparty $GITHUB_REF_NAME (mpv $MPV_TAG)" \
              --notes-file "$RUNNER_TEMP/notes-final.md"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "watchparty $GITHUB_REF_NAME (mpv $MPV_TAG)" \
              --notes-file "$RUNNER_TEMP/notes-final.md" \
              dist/*.zip dist/SHA256SUMS
          fi
